<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', 'Liberation Mono', 'Courier New', monospace, 'Segoe UI', 'Arial', sans-serif;
            box-sizing: border-box;
        }
        .center-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .corner-img {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 15vw;
            height: auto;
            z-index: -1;
        }
        h1 {
            font-size: 10vw;
            margin: 0;
        }
        p {
            margin: 0.5em 0 0 0;
        }
        .msg {
            font-size: 3vw;
        }
        .back-link {
            font-size: 2vw;
        }
    </style>
</head>
<body>
    <img src="web/resources/page/Diogenex10.gif" class="corner-img" alt="artwork by marie-pepo">
    <div class="center-content">
        <h1>404</h1>
        <p class="msg">Page Not Found</p>
        <p class="back-link">Go back to the <a href="index.html">landing page</a></p>
    </div>
</body>
</html>
