<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuGame Scene Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 14px;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 340px;
            background: #242424;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 12px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            position: relative;
        }

        #canvas {
            background: #222;
            border: 1px solid #444;
            cursor: crosshair;
        }

        .section {
            margin-bottom: 16px;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #7ec7ff;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .mode-group {
            display: flex;
            gap: 4px;
        }

        .mode-btn {
            padding: 4px 12px;
            background: #333;
            border: 1px solid #444;
            color: #aaa;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #3a7bd5;
            color: #fff;
            border-color: #3a7bd5;
        }

        button {
            padding: 6px 12px;
            background: #3a7bd5;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #4a8be5;
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover:not(:disabled) {
            background: #f75c4c;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover:not(:disabled) {
            background: #37be70;
        }

        input[type="text"], input[type="number"], select {
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 13px;
        }

        input[type="checkbox"] {
            accent-color: #3a7bd5;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            resize: vertical;
        }

        .entity-list {
            max-height: 200px;
            overflow-y: auto;
            background: #333;
            border: 1px solid #444;
            border-radius: 3px;
            margin-bottom: 8px;
        }

        .entity-item {
            padding: 6px 8px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .entity-item:hover {
            background: #3a3a3a;
        }

        .entity-item.selected {
            background: #3a7bd5;
            color: #fff;
        }

        .entity-info {
            font-size: 12px;
            color: #888;
        }

        .entity-item.selected .entity-info {
            color: #ccc;
        }

        .component-panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
            position: absolute;
            right: 12px;
            top: 12px;
            width: 320px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            display: none;
        }

        .component-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .component-name {
            font-weight: 600;
            color: #7ec7ff;
        }

        .component-fields {
            display: grid;
            gap: 6px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            align-items: center;
            gap: 8px;
        }

        .field-label {
            font-size: 12px;
            color: #aaa;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        #status {
            position: fixed;
            bottom: 12px;
            right: 12px;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 12px;
            color: #7ec7ff;
            display: none;
        }

        #status.show {
            display: block;
        }

        .tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid #444;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 16px;
            background: #2a2a2a;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-right: 1px solid #333;
            min-width: 80px;
            font-size: 13px;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            background: #333;
        }

        .tab.active {
            background: #3a7bd5;
            color: #fff;
        }

        .tab-close {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: inherit;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover .tab-close {
            display: inline-block;
        }

        .tab-close:hover {
            background: rgba(231, 76, 60, 0.8);
            color: #fff;
        }

        .tab-add {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #7ec7ff;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .tab-add:hover {
            background: #333;
        }

        .meta-panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
            position: absolute;
            left: 12px;
            top: 50px;
            width: 320px;
            max-height: calc(100vh - 74px);
            overflow-y: auto;
            z-index: 10;
        }

        .meta-field {
            margin-bottom: 12px;
        }

        .meta-label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .meta-description {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .toggle-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 11;
        }

        .toggle-btn {
            padding: 6px 12px;
            background: #3a7bd5;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .toggle-btn:hover {
            background: #4a8be5;
        }
    </style>
</head>
<body>
    <div class="tabs" id="sceneTabs">
        <button class="tab active" data-scene="0">Scene 1</button>
        <button class="tab-add" id="addSceneBtn">+</button>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 style="margin: 0; font-size: 18px;">AuGame Scene Editor</h2>
            </div>
            <div class="sidebar-content">
                <div class="section">
                    <div class="section-title">Mode</div>
                    <div class="mode-group">
                        <button class="mode-btn active" data-mode="draw">Draw</button>
                        <button class="mode-btn" data-mode="move">Move</button>
                        <button class="mode-btn" data-mode="edit">Edit</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">New Entity</div>
                    <div class="controls-row">
                        <input type="number" id="nextId" value="1" min="0" style="width: 60px;">
                        <input type="text" id="nextName" value="entity1" style="flex: 1;">
                    </div>
                    <div class="controls-row">
                        <label style="font-size: 12px;">
                            <input type="checkbox" id="snapToggle" checked> Snap to 0.5
                        </label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Entities</div>
                    <div id="entityList" class="entity-list"></div>
                    <div class="toolbar">
                        <button id="deleteBtn" class="btn-danger" disabled>Delete</button>
                        <button id="duplicateBtn" disabled>Duplicate</button>
                        <button id="clearBtn" class="btn-danger">Clear All</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Export</div>
                    <div class="controls-row">
                        <label style="font-size: 12px;">
                            <input type="checkbox" id="exportMultiScene"> All scenes
                        </label>
                        <label style="font-size: 12px; margin-left: 12px;">
                            <input type="checkbox" id="includeEmptyMeta"> Include defaults
                        </label>
                    </div>
                    <textarea id="exportText" readonly placeholder="Entity data will appear here..."></textarea>
                    <div class="toolbar" style="margin-top: 8px;">
                        <button id="exportBtn">Export</button>
                        <button id="copyBtn">Copy to Clipboard</button>
                        <button id="importBtn">Import</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Blueprints</div>
                    <div class="toolbar">
                        <button id="saveBlueprintBtn" disabled>Save Blueprint</button>
                        <button id="loadBlueprintBtn">Load</button>
                    </div>
                    <div id="blueprintList" class="entity-list"></div>
                    <div class="toolbar" style="margin-top: 8px;">
                        <button id="exportBlueprintsBtn" style="font-size: 11px;">Export All</button>
                        <button id="importBlueprintsBtn" style="font-size: 11px;">Import</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Storage</div>
                    <div class="controls-row">
                        <input type="text" id="sceneName" placeholder="Scene name" style="flex: 1;">
                        <button id="saveBtn" class="btn-success">Save</button>
                    </div>
                    <div id="sceneList" class="entity-list" style="margin-top: 8px;"></div>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="canvas" width="800" height="600"></canvas>
            <div class="toggle-panel">
                <button class="toggle-btn" id="toggleMetaBtn">Meta Tags</button>
            </div>
            <div id="metaPanel" class="meta-panel" style="display: none;">
                <div class="section-title" style="margin-top: 0;">Scene Meta Tags</div>
                <div id="metaFields"></div>
            </div>
            <div id="componentPanel" class="component-panel">
                <div class="section-title" style="margin-top: 0;">Components</div>
                <div id="componentList"></div>
            </div>
        </div>
    </div>

    <div id="status"></div>

    <!-- Import Modal -->
    <div id="importModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 20px; width: 500px; max-width: 90%;">
            <h3 style="margin: 0 0 16px 0; color: #7ec7ff;">Import Scene</h3>

            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; color: #aaa;">Import Method:</label>
                <select id="importMethod" style="width: 100%; padding: 8px; background: #333; color: #eee; border: 1px solid #444; border-radius: 3px;">
                    <option value="text">Paste Config Text</option>
                    <option value="url">Load from URL</option>
                    <option value="example">Load Example Scene</option>
                </select>
            </div>

            <div id="importTextArea" style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; color: #aaa;">Config Text:</label>
                <textarea id="importTextInput" style="width: 100%; height: 200px; background: #333; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 8px; font-family: monospace; font-size: 12px;" placeholder="Paste your config text here..."></textarea>
            </div>

            <div id="importUrlArea" style="display: none; margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; color: #aaa;">Config URL:</label>
                <input type="text" id="importUrlInput" style="width: 100%; padding: 8px; background: #333; color: #eee; border: 1px solid #444; border-radius: 3px;" placeholder="https://example.com/config.txt">
            </div>

            <div id="importExampleArea" style="display: none; margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; color: #aaa;">Example Scenes:</label>
                <select id="importExampleSelect" style="width: 100%; padding: 8px; background: #333; color: #eee; border: 1px solid #444; border-radius: 3px;">
                    <option value="/web/econfigs/default.txt">Default Scene</option>
                    <option value="/web/econfigs/mconfig.txt">Multi-Scene Example</option>
                    <option value="/web/econfigs/testinteriors.txt">Interior Test</option>
                    <option value="/web/econfigs/simple.txt">Simple Scene</option>
                </select>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="color: #aaa;">
                    <input type="checkbox" id="importReplace" checked> Replace existing entities (uncheck to append)
                </label>
            </div>

            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button onclick="editor.cancelImport()" style="background: #444;">Cancel</button>
                <button onclick="editor.confirmImport()" style="background: #3a7bd5;">Import</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
