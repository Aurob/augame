<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Entity Builder v3 (Component-based)</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #222;
            color: #eee;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 340px;
            background: #23272e;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 2px solid #333;
        }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #181a1b;
            position: relative;
        }
        #drawCanvas {
            background: #222;
            border: 2px solid #444;
            box-shadow: 0 0 8px #000a;
            cursor: crosshair;
        }
        .section-title {
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 15px;
            color: #7ec7ff;
        }
        .entity-list {
            margin: 8px 0 16px 0;
            max-height: 180px;
            overflow-y: auto;
            background: #181a1b;
            border: 1px solid #333;
            padding: 4px;
            font-size: 14px;
        }
        .entity-list .entity-item {
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .entity-list .entity-item.selected {
            background: #3a7bd5;
            color: #fff;
        }
        .component-panel {
            background: #181a1b;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            min-width: 340px;
            max-width: 400px;
        }
        .component-row {
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        .component-row label {
            margin-right: 12px;
            font-size: 14px;
        }
        .color-preview {
            display: inline-block;
            width: 24px;
            height: 18px;
            border: 1px solid #555;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 3px;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            background: #111;
            color: #eee;
            border: 1px solid #333;
            margin-top: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        button {
            background: #3a7bd5;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 5px 12px;
            margin-right: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            background: #444;
            color: #aaa;
            cursor: not-allowed;
        }
        input[type="number"], input[type="text"] {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 2px;
            padding: 2px 4px;
            font-size: 14px;
        }
        input[type="checkbox"] {
            accent-color: #3a7bd5;
        }
        .snap-toggle {
            margin-left: 8px;
            font-size: 13px;
        }
        .dup-btn {
            background: #7ec7ff;
            color: #222;
            font-weight: bold;
            padding: 2px 8px;
            font-size: 13px;
            margin-left: 8px;
        }
        .load-btn {
            background: #7ec7ff;
            color: #222;
            font-weight: bold;
            padding: 2px 8px;
            font-size: 13px;
            margin-left: 8px;
        }
        .save-btn {
            background: #3a7bd5;
            color: #fff;
            font-weight: bold;
            padding: 2px 8px;
            font-size: 13px;
            margin-left: 8px;
        }
        .delete-btn {
            background: #e74c3c;
            color: #fff;
            font-weight: bold;
            padding: 2px 8px;
            font-size: 13px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="section-title">Mode</div>
            <div class="component-row">
                <label><input type="radio" name="mode" value="draw" checked> Draw</label>
                <label><input type="radio" name="mode" value="move"> Move</label>
                <label><input type="radio" name="mode" value="edit"> Edit</label>
            </div>
            <div class="section-title">New Entity</div>
            <div>
                <label>ID: <input type="number" id="entityId" value="1" min="0" style="width:60px;"></label>
                <label>Name: <input type="text" id="entityName" value="entity1" style="width:90px;"></label>
            </div>
            <div style="margin-top:8px;">
                <button id="deleteBtn" disabled>Delete Selected</button>
                <button id="clearBtn">Clear All</button>
                <button id="duplicateBtn" disabled>Duplicate</button>
            </div>
            <div class="section-title">Entities</div>
            <div class="entity-list" id="entityList"></div>
            <div>
                <button id="exportBtn">Export & Copy</button>
            </div>
            <textarea id="exportBox" readonly placeholder="Exported data will appear here"></textarea>
            <div class="section-title">Scenes</div>
            <div>
                <input type="text" id="sceneNameInput" placeholder="Scene name" style="width:120px;">
                <button id="saveSceneBtn" class="save-btn">Save</button>
            </div>
            <div class="entity-list" id="sceneList"></div>
            <div class="section-title">Blueprints</div>
            <div>
                <input type="text" id="blueprintNameInput" placeholder="Blueprint name" style="width:120px;">
                <button id="saveBlueprintBtn" class="save-btn">Save</button>
            </div>
            <div class="entity-list" id="blueprintList"></div>
        </div>
        <div class="canvas-area">
            <canvas id="drawCanvas" width="800" height="600"></canvas>
            <div id="componentPanel" class="component-panel" style="display:none; position:absolute; right:0; top:0; z-index:10;">
                <div class="section-title" style="margin-top:0;">Edit Components</div>
                <div id="componentFields"></div>
                <div class="component-row">
                    <label class="snap-toggle"><input type="checkbox" id="snapToggle" checked> Snap to 0.5</label>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        // --- Component Definitions (should match @structs.hpp) ---
        // Each entity is a set of components, each component is a JS object with a type and params.
        // Example: { type: "Position", x: 0, y: 0 }
        // Supported: Position, Shape, Color, RenderPriority, Player, Collidable, Interior, Inside, Text, Movement, InteriorPortal

        // --- Import (simulate) ---
        // In a real integration, these would be imported from ebuilder.js/WebUtils.hpp/structs.hpp
        // For now, we define the component schemas here:
        const COMPONENT_SCHEMAS = [
            {
                type: "Position",
                params: [
                    { name: "x", type: "number", step: 0.01, label: "X", default: 0 },
                    { name: "y", type: "number", step: 0.01, label: "Y", default: 0 }
                ]
            },
            {
                type: "Shape",
                params: [
                    { name: "w", type: "number", step: 0.01, label: "W", default: 1 },
                    { name: "h", type: "number", step: 0.01, label: "H", default: 1 }
                ]
            },
            {
                type: "Color",
                params: [
                    { name: "r", type: "number", min: 0, max: 255, step: 1, label: "R", default: 136 },
                    { name: "g", type: "number", min: 0, max: 255, step: 1, label: "G", default: 238 },
                    { name: "b", type: "number", min: 0, max: 255, step: 1, label: "B", default: 255 },
                    { name: "a", type: "number", min: 0, max: 1, step: 0.01, label: "A", default: 1 }
                ]
            },
            {
                type: "RenderPriority",
                params: [
                    { name: "z", type: "number", step: 1, label: "Z", default: 0 }
                ]
            },
            {
                type: "Player",
                params: []
            },
            {
                type: "Collidable",
                params: []
            },
            {
                type: "Interior",
                params: []
            },
            {
                type: "Inside",
                params: [
                    { name: "insideId", type: "number", step: 1, label: "Inside ID", default: 0 }
                ]
            },
            {
                type: "Text",
                params: [
                    { name: "text", type: "text", label: "Text", default: "" },
                    { name: "scale", type: "number", step: 0.01, label: "Scale", default: 1 },
                    { name: "hidden", type: "checkbox", label: "Hidden", default: false }
                ]
            },
            {
                type: "Movement",
                params: [
                    { name: "speed", type: "number", step: 0.01, label: "Speed", default: 0 },
                    { name: "mass", type: "number", step: 0.01, label: "Mass", default: 0 },
                    { name: "restitution", type: "number", step: 0.01, label: "Restitution", default: 0 },
                    { name: "friction", type: "number", step: 0.01, label: "Friction", default: 0 }
                ]
            },
            {
                type: "InteriorPortal",
                params: [
                    { name: "A", type: "number", step: 1, label: "A", default: 0 },
                    { name: "B", type: "number", step: 1, label: "B", default: 0 },
                    { name: "key", type: "number", step: 1, label: "Key", default: -1 },
                    { name: "locked", type: "checkbox", label: "Locked", default: false }
                ]
            }
        ];

        // --- Data Model ---
        let entities = [];
        let selectedEntityIdx = null;
        let snapEnabled = true;
        let mode = "draw"; // or "move" or "edit"

        // --- UI Elements ---
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const entityIdInput = document.getElementById('entityId');
        const entityNameInput = document.getElementById('entityName');
        const entityListDiv = document.getElementById('entityList');
        const exportBox = document.getElementById('exportBox');
        const deleteBtn = document.getElementById('deleteBtn');
        const clearBtn = document.getElementById('clearBtn');
        const duplicateBtn = document.getElementById('duplicateBtn');
        const exportBtn = document.getElementById('exportBtn');
        const componentPanel = document.getElementById('componentPanel');
        const componentFields = document.getElementById('componentFields');
        const snapToggle = document.getElementById('snapToggle');
        // Scene/blueprint
        const sceneNameInput = document.getElementById('sceneNameInput');
        const saveSceneBtn = document.getElementById('saveSceneBtn');
        const sceneListDiv = document.getElementById('sceneList');
        const blueprintNameInput = document.getElementById('blueprintNameInput');
        const saveBlueprintBtn = document.getElementById('saveBlueprintBtn');
        const blueprintListDiv = document.getElementById('blueprintList');

        // --- LocalStorage Keys ---
        const SCENE_PREFIX = "sceneBuilderV3_scene_";
        const BLUEPRINT_PREFIX = "sceneBuilderV3_blueprint_";

        // --- Utility ---
        function getComponent(entity, type) {
            return entity.components.find(c => c.type === type);
        }
        function ensureComponent(entity, type) {
            let c = getComponent(entity, type);
            if (!c) {
                const schema = COMPONENT_SCHEMAS.find(s => s.type === type);
                c = { type };
                if (schema) {
                    for (let p of schema.params) {
                        c[p.name] = p.default;
                    }
                }
                entity.components.push(c);
            }
            return c;
        }
        function removeComponent(entity, type) {
            entity.components = entity.components.filter(c => c.type !== type);
        }
        function getEntityName(entity) {
            return entity.name || ("entity" + entity.id);
        }
        function getNextEntityId() {
            let maxId = 0;
            for (let e of entities) {
                if (typeof e.id === "number" && e.id > maxId) maxId = e.id;
            }
            return maxId + 1;
        }
        function getNextEntityName() {
            let maxN = 0;
            for (let e of entities) {
                let m = /^entity(\d+)$/.exec(e.name);
                if (m) {
                    let n = parseInt(m[1], 10);
                    if (n > maxN) maxN = n;
                }
            }
            return "entity" + (maxN + 1);
        }
        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }
        function snapValue(val) {
            if (!snapEnabled) return val;
            return Math.round(val * 2) / 2;
        }
        function snapPx(val) {
            if (!snapEnabled) return val;
            return Math.round(val / 8) * 8;
        }
        function rgbaString(r, g, b, a) {
            return `rgba(${r},${g},${b},${a})`;
        }
        function hexToRgb(hex) {
            hex = hex.replace(/^#/, "");
            if (hex.length === 3) hex = hex.split("").map(x => x + x).join("");
            let num = parseInt(hex, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }
        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                let hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("");
        }

        // --- Drawing ---
        function drawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Sort by RenderPriority.z, then id
            let sorted = entities.slice().sort((a, b) => {
                let az = getComponent(a, "RenderPriority")?.z ?? 0;
                let bz = getComponent(b, "RenderPriority")?.z ?? 0;
                if (az !== bz) return az - bz;
                return (a.id || 0) - (b.id || 0);
            });
            for (let i = 0; i < sorted.length; ++i) {
                const e = sorted[i];
                const pos = getComponent(e, "Position");
                const shape = getComponent(e, "Shape");
                const color = getComponent(e, "Color") || { r: 136, g: 238, b: 255, a: 1.0 };
                if (!pos || !shape) continue;
                ctx.fillStyle = rgbaString(color.r, color.g, color.b, color.a);
                ctx.fillRect(pos.x * 16, pos.y * 16, shape.w * 16, shape.h * 16);
                // Border
                let idx = entities.indexOf(e);
                ctx.lineWidth = (idx === selectedEntityIdx) ? 3 : 1.5;
                ctx.strokeStyle = (idx === selectedEntityIdx) ? "#3a7bd5" : "#444";
                ctx.strokeRect(pos.x * 16, pos.y * 16, shape.w * 16, shape.h * 16);
                // Label
                ctx.font = "bold 13px sans-serif";
                ctx.fillStyle = "#fff";
                ctx.textBaseline = "top";
                ctx.fillText(`${e.id}:${getEntityName(e)}`, pos.x * 16 + 4, pos.y * 16 + 2);
                // RenderPriority
                ctx.font = "10px monospace";
                ctx.fillStyle = "#7ec7ff";
                let z = getComponent(e, "RenderPriority")?.z ?? 0;
                ctx.fillText(`z:${z}`, pos.x * 16 + 4, pos.y * 16 + 18);
            }
        }

        // --- Entity List ---
        function updateEntityList() {
            entityListDiv.innerHTML = "";
            let sorted = entities.map((e, i) => ({e, i})).sort((a, b) => {
                let az = getComponent(a.e, "RenderPriority")?.z ?? 0;
                let bz = getComponent(b.e, "RenderPriority")?.z ?? 0;
                if (az !== bz) return az - bz;
                return (a.e.id || 0) - (b.e.id || 0);
            });
            sorted.forEach(({e, i}) => {
                const pos = getComponent(e, "Position");
                const shape = getComponent(e, "Shape");
                let posStr = pos && shape
                    ? `[${(pos.x).toFixed(2)}, ${(pos.y).toFixed(2)}] w:${(shape.w).toFixed(2)} h:${(shape.h).toFixed(2)}`
                    : "";
                let z = getComponent(e, "RenderPriority")?.z ?? 0;
                const div = document.createElement('div');
                div.className = "entity-item" + (i === selectedEntityIdx ? " selected" : "");
                div.innerHTML = `<span>#${e.id} ${getEntityName(e)} ${posStr} z:${z}</span>
                    <button class="dup-btn" title="Duplicate">⧉</button>`;
                div.onclick = (evt) => {
                    if (evt.target.classList.contains("dup-btn")) {
                        duplicateEntity(i);
                        evt.stopPropagation();
                        return;
                    }
                    selectedEntityIdx = i;
                    updateEntityList();
                    drawAll();
                    updateComponentPanel();
                    deleteBtn.disabled = false;
                    duplicateBtn.disabled = false;
                };
                entityListDiv.appendChild(div);
            });
            if (selectedEntityIdx === null || entities.length === 0) {
                deleteBtn.disabled = true;
                duplicateBtn.disabled = true;
            }
            updateComponentPanel();
        }

        function resetSelection() {
            selectedEntityIdx = null;
            updateEntityList();
            drawAll();
            updateComponentPanel();
        }

        // --- Component Panel ---
        function updateComponentPanel() {
            if (selectedEntityIdx === null || !entities[selectedEntityIdx]) {
                componentPanel.style.display = "none";
                return;
            }
            componentPanel.style.display = "block";
            componentFields.innerHTML = "";
            const entity = entities[selectedEntityIdx];
            // For each schema, show a section if present or allow add
            for (let schema of COMPONENT_SCHEMAS) {
                let comp = getComponent(entity, schema.type);
                let row = document.createElement("div");
                row.className = "component-row";
                let label = document.createElement("label");
                label.textContent = schema.type;
                row.appendChild(label);

                if (schema.params.length === 0) {
                    // Toggle presence
                    let cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.checked = !!comp;
                    cb.onchange = () => {
                        if (cb.checked) ensureComponent(entity, schema.type);
                        else removeComponent(entity, schema.type);
                        updateComponentPanel();
                        drawAll();
                        updateEntityList();
                    };
                    row.appendChild(cb);
                } else if (comp) {
                    // Show fields
                    for (let param of schema.params) {
                        let plabel = document.createElement("label");
                        plabel.textContent = param.label + ":";
                        let inp;
                        if (param.type === "checkbox") {
                            inp = document.createElement("input");
                            inp.type = "checkbox";
                            inp.checked = !!comp[param.name];
                            inp.onchange = () => {
                                comp[param.name] = inp.checked;
                                drawAll();
                                updateEntityList();
                            };
                        } else if (param.type === "text") {
                            inp = document.createElement("input");
                            inp.type = "text";
                            inp.value = comp[param.name] ?? param.default;
                            inp.oninput = () => {
                                comp[param.name] = inp.value;
                                drawAll();
                                updateEntityList();
                            };
                        } else {
                            inp = document.createElement("input");
                            inp.type = "number";
                            if (param.min !== undefined) inp.min = param.min;
                            if (param.max !== undefined) inp.max = param.max;
                            if (param.step !== undefined) inp.step = param.step;
                            inp.value = comp[param.name] ?? param.default;
                            inp.oninput = () => {
                                comp[param.name] = parseFloat(inp.value);
                                drawAll();
                                updateEntityList();
                            };
                        }
                        plabel.appendChild(inp);
                        row.appendChild(plabel);
                    }
                    // Remove button
                    let remBtn = document.createElement("button");
                    remBtn.textContent = "Remove";
                    remBtn.className = "delete-btn";
                    remBtn.onclick = (e) => {
                        removeComponent(entity, schema.type);
                        updateComponentPanel();
                        drawAll();
                        updateEntityList();
                        e.preventDefault();
                        e.stopPropagation();
                    };
                    row.appendChild(remBtn);
                } else {
                    // Add button
                    let addBtn = document.createElement("button");
                    addBtn.textContent = "Add";
                    addBtn.className = "save-btn";
                    addBtn.onclick = (e) => {
                        ensureComponent(entity, schema.type);
                        updateComponentPanel();
                        drawAll();
                        updateEntityList();
                        e.preventDefault();
                        e.stopPropagation();
                    };
                    row.appendChild(addBtn);
                }
                componentFields.appendChild(row);
            }
        }

        // --- Drawing/Moving/Editing Mode ---
        let isDrawing = false;
        let isMoving = false;
        let drawStart = { x: 0, y: 0 };
        let moveOffset = { x: 0, y: 0 };
        let isResizing = false;
        let resizeDir = null;
        let resizeStart = { x: 0, y: 0 };
        let origRect = null;

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) * (canvas.width / rect.width),
                y: (evt.clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        function rectContains(pos, shape, x, y) {
            return x >= pos.x * 16 && x <= pos.x * 16 + shape.w * 16 &&
                   y >= pos.y * 16 && y <= pos.y * 16 + shape.h * 16;
        }
        function getResizeHandle(pos, shape, mx, my) {
            // Returns "nw", "ne", "sw", "se" or null if not near a corner
            const handles = [
                { name: "nw", x: pos.x * 16, y: pos.y * 16 },
                { name: "ne", x: pos.x * 16 + shape.w * 16, y: pos.y * 16 },
                { name: "sw", x: pos.x * 16, y: pos.y * 16 + shape.h * 16 },
                { name: "se", x: pos.x * 16 + shape.w * 16, y: pos.y * 16 + shape.h * 16 }
            ];
            for (let h of handles) {
                if (Math.abs(mx - h.x) < 10 && Math.abs(my - h.y) < 10) return h.name;
            }
            return null;
        }

        canvas.addEventListener('mousedown', function (evt) {
            const mouse = getMousePos(evt);
            if (mode === "draw") {
                isDrawing = true;
                drawStart = mouse;
            } else if (mode === "move") {
                let found = false;
                for (let i = entities.length - 1; i >= 0; --i) {
                    const e = entities[i];
                    const pos = getComponent(e, "Position");
                    const shape = getComponent(e, "Shape");
                    if (!pos || !shape) continue;
                    if (rectContains(pos, shape, mouse.x, mouse.y)) {
                        selectedEntityIdx = i;
                        moveOffset.x = mouse.x - pos.x * 16;
                        moveOffset.y = mouse.y - pos.y * 16;
                        isMoving = true;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    resetSelection();
                } else {
                    updateEntityList();
                    drawAll();
                }
            } else if (mode === "edit") {
                let found = false;
                for (let i = entities.length - 1; i >= 0; --i) {
                    const e = entities[i];
                    const pos = getComponent(e, "Position");
                    const shape = getComponent(e, "Shape");
                    if (!pos || !shape) continue;
                    if (rectContains(pos, shape, mouse.x, mouse.y)) {
                        selectedEntityIdx = i;
                        let handle = getResizeHandle(pos, shape, mouse.x, mouse.y);
                        if (handle) {
                            isResizing = true;
                            resizeDir = handle;
                            resizeStart = mouse;
                            origRect = { x: pos.x, y: pos.y, w: shape.w, h: shape.h };
                        } else {
                            isMoving = true;
                            moveOffset.x = mouse.x - pos.x * 16;
                            moveOffset.y = mouse.y - pos.y * 16;
                        }
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    resetSelection();
                } else {
                    updateEntityList();
                    drawAll();
                }
            }
        });

        canvas.addEventListener('mousemove', function (evt) {
            const mouse = getMousePos(evt);
            if (mode === "draw" && isDrawing) {
                drawAll();
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = "#7ec7ff";
                ctx.lineWidth = 2;
                let x = Math.min(drawStart.x, mouse.x);
                let y = Math.min(drawStart.y, mouse.y);
                let w = Math.abs(drawStart.x - mouse.x);
                let h = Math.abs(drawStart.y - mouse.y);
                ctx.strokeRect(x, y, w, h);
                ctx.restore();
            } else if (mode === "move" && isMoving && selectedEntityIdx !== null) {
                let e = entities[selectedEntityIdx];
                let pos = getComponent(e, "Position");
                let shape = getComponent(e, "Shape");
                let newX = clamp((mouse.x - moveOffset.x) / 16, 0, (canvas.width - shape.w * 16) / 16);
                let newY = clamp((mouse.y - moveOffset.y) / 16, 0, (canvas.height - shape.h * 16) / 16);
                pos.x = snapValue(newX);
                pos.y = snapValue(newY);
                drawAll();
                updateEntityList();
            } else if (mode === "edit" && selectedEntityIdx !== null) {
                let e = entities[selectedEntityIdx];
                let pos = getComponent(e, "Position");
                let shape = getComponent(e, "Shape");
                if (isResizing) {
                    let dx = (mouse.x - resizeStart.x) / 16;
                    let dy = (mouse.y - resizeStart.y) / 16;
                    let x = origRect.x, y = origRect.y, w = origRect.w, h = origRect.h;
                    if (resizeDir === "nw") {
                        x += dx; y += dy; w -= dx; h -= dy;
                    } else if (resizeDir === "ne") {
                        y += dy; w += dx; h -= dy;
                    } else if (resizeDir === "sw") {
                        x += dx; w -= dx; h += dy;
                    } else if (resizeDir === "se") {
                        w += dx; h += dy;
                    }
                    w = Math.max(0.5, w); h = Math.max(0.5, h);
                    pos.x = clamp(snapValue(x), 0, (canvas.width - w * 16) / 16);
                    pos.y = clamp(snapValue(y), 0, (canvas.height - h * 16) / 16);
                    shape.w = snapValue(w);
                    shape.h = snapValue(h);
                    drawAll();
                    updateEntityList();
                } else if (isMoving) {
                    let newX = clamp((mouse.x - moveOffset.x) / 16, 0, (canvas.width - shape.w * 16) / 16);
                    let newY = clamp((mouse.y - moveOffset.y) / 16, 0, (canvas.height - shape.h * 16) / 16);
                    pos.x = snapValue(newX);
                    pos.y = snapValue(newY);
                    drawAll();
                    updateEntityList();
                } else {
                    let handle = getResizeHandle(pos, shape, mouse.x, mouse.y);
                    if (handle) {
                        canvas.style.cursor = "nwse-resize";
                    } else if (rectContains(pos, shape, mouse.x, mouse.y)) {
                        canvas.style.cursor = "move";
                    } else {
                        canvas.style.cursor = "default";
                    }
                }
            }
        });

        canvas.addEventListener('mouseup', function (evt) {
            const mouse = getMousePos(evt);
            if (mode === "draw" && isDrawing) {
                isDrawing = false;
                let x = Math.min(drawStart.x, mouse.x);
                let y = Math.min(drawStart.y, mouse.y);
                let w = Math.abs(drawStart.x - mouse.x);
                let h = Math.abs(drawStart.y - mouse.y);
                if (w > 8 && h > 8) {
                    let id = parseInt(entityIdInput.value, 10) || getNextEntityId();
                    let name = entityNameInput.value || getNextEntityName();
                    // Snap to grid
                    x = snapPx(x);
                    y = snapPx(y);
                    w = snapPx(w);
                    h = snapPx(h);
                    let entity = {
                        id: id,
                        name: name,
                        components: [
                            { type: "Position", x: x / 16, y: y / 16 },
                            { type: "Shape", w: w / 16, h: h / 16 },
                            { type: "Color", r: 136, g: 238, b: 255, a: 1.0 },
                            { type: "RenderPriority", z: 0 }
                        ]
                    };
                    entities.push(entity);
                    // Auto-increment id and name
                    let nextId = id + 1;
                    entityIdInput.value = nextId;
                    let nextName = "entity" + nextId;
                    entityNameInput.value = nextName;
                    updateEntityList();
                    drawAll();
                }
            } else if ((mode === "move" || mode === "edit") && (isMoving || isResizing)) {
                isMoving = false;
                isResizing = false;
                drawAll();
                updateEntityList();
            }
        });

        // --- Mode Switching ---
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function () {
                mode = this.value;
                if (mode !== "edit") {
                    componentPanel.style.display = "none";
                } else {
                    updateComponentPanel();
                }
                drawAll();
            });
        });

        // --- Snap toggle ---
        snapToggle.addEventListener('change', function() {
            snapEnabled = snapToggle.checked;
        });

        // --- Entity List Controls ---
        deleteBtn.addEventListener('click', function () {
            if (selectedEntityIdx !== null) {
                entities.splice(selectedEntityIdx, 1);
                resetSelection();
                drawAll();
            }
        });
        clearBtn.addEventListener('click', function () {
            entities = [];
            resetSelection();
            drawAll();
        });
        duplicateBtn.addEventListener('click', function () {
            if (selectedEntityIdx !== null) {
                duplicateEntity(selectedEntityIdx);
            }
        });
        function duplicateEntity(idx) {
            if (idx == null || !entities[idx]) return;
            let orig = entities[idx];
            let copy = JSON.parse(JSON.stringify(orig));
            copy.id = getNextEntityId();
            copy.name = getNextEntityName();
            // Offset position
            let pos = getComponent(copy, "Position");
            if (pos) { pos.x += 1; pos.y += 1; }
            entities.push(copy);
            selectedEntityIdx = entities.length - 1;
            updateEntityList();
            drawAll();
        }

        // Keyboard shortcut for delete/duplicate
        document.addEventListener('keydown', function (evt) {
            if (evt.key === "Delete" && selectedEntityIdx !== null) {
                entities.splice(selectedEntityIdx, 1);
                resetSelection();
                drawAll();
            }
            if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === "d" && selectedEntityIdx !== null) {
                duplicateEntity(selectedEntityIdx);
            }
        });

        // --- Export ---
        function exportEntities() {
            // Export as a component list per entity, matching C++/game codebase
            let lines = [];
            let sorted = entities.slice().sort((a, b) => {
                let az = getComponent(a, "RenderPriority")?.z ?? 0;
                let bz = getComponent(b, "RenderPriority")?.z ?? 0;
                if (az !== bz) return az - bz;
                return (a.id || 0) - (b.id || 0);
            });
            for (let e of sorted) {
                let comps = [];
                comps.push(`id ${e.id} ${getEntityName(e)}`);
                for (let c of e.components) {
                    if (c.type === "Position") {
                        comps.push(`position ${c.x.toFixed(4)} ${c.y.toFixed(4)} 0`);
                    } else if (c.type === "Shape") {
                        comps.push(`shape ${c.w.toFixed(4)} ${c.h.toFixed(4)} 0`);
                    } else if (c.type === "Color") {
                        comps.push(`color ${(c.r/255).toFixed(2)} ${(c.g/255).toFixed(2)} ${(c.b/255).toFixed(2)} ${c.a}`);
                    } else if (c.type === "RenderPriority") {
                        comps.push(`renderPriority ${c.z}`);
                    } else if (c.type === "Player") {
                        comps.push("player");
                    } else if (c.type === "Collidable") {
                        comps.push("collidable");
                    } else if (c.type === "Interior") {
                        comps.push("interior");
                    } else if (c.type === "Inside") {
                        comps.push(`inside ${c.insideId}`);
                    } else if (c.type === "Text") {
                        let hide = c.hidden ? 1 : 0;
                        comps.push(`text "${(c.text||"").replace(/"/g, '\\"')}" ${c.scale||1} ${hide}`);
                    } else if (c.type === "Movement") {
                        comps.push(`movement ${c.speed||0} ${c.mass||0} ${c.restitution||0} ${c.friction||0}`);
                    } else if (c.type === "InteriorPortal") {
                        comps.push(`interiorPortal ${c.A||0} ${c.B||0} ${c.locked?1:0} ${c.key||-1}`);
                    }
                }
                lines.push(comps.join(" "));
            }
            exportBox.value = lines.join("\n");
            navigator.clipboard.writeText(exportBox.value).then(() => {
                exportBtn.textContent = "Copied!";
                setTimeout(() => exportBtn.textContent = "Export & Copy", 1000);
            });
        }
        exportBtn.addEventListener('click', exportEntities);

        // --- New Entity Controls ---
        entityIdInput.addEventListener('input', function () {
            // No-op, used for next entity
        });
        entityNameInput.addEventListener('input', function () {
            // No-op, used for next entity
        });

        // --- Scene Save/Load ---
        function saveScene(name) {
            if (!name) return;
            localStorage.setItem(SCENE_PREFIX + name, JSON.stringify(entities));
            updateSceneList();
        }
        function loadScene(name) {
            let data = localStorage.getItem(SCENE_PREFIX + name);
            if (!data) return;
            entities = JSON.parse(data);
            resetSelection();
            drawAll();
        }
        function deleteScene(name) {
            localStorage.removeItem(SCENE_PREFIX + name);
            updateSceneList();
        }
        function updateSceneList() {
            sceneListDiv.innerHTML = "";
            let scenes = [];
            for (let k in localStorage) {
                if (k.startsWith(SCENE_PREFIX)) {
                    scenes.push(k.substring(SCENE_PREFIX.length));
                }
            }
            scenes.sort();
            scenes.forEach(name => {
                let div = document.createElement('div');
                div.className = "entity-item";
                div.innerHTML = `<span>${name}</span>
                    <button class="load-btn" title="Load">Load</button>
                    <button class="delete-btn" title="Delete">✕</button>`;
                div.querySelector('.load-btn').onclick = (e) => { loadScene(name); e.stopPropagation(); };
                div.querySelector('.delete-btn').onclick = (e) => { deleteScene(name); e.stopPropagation(); };
                sceneListDiv.appendChild(div);
            });
        }
        saveSceneBtn.addEventListener('click', function() {
            let name = sceneNameInput.value.trim();
            if (!name) return;
            saveScene(name);
        });

        // --- Blueprint Save/Load ---
        function saveBlueprint(name) {
            if (!name || selectedEntityIdx === null) return;
            let e = entities[selectedEntityIdx];
            localStorage.setItem(BLUEPRINT_PREFIX + name, JSON.stringify(e));
            updateBlueprintList();
        }
        function loadBlueprint(name) {
            let data = localStorage.getItem(BLUEPRINT_PREFIX + name);
            if (!data) return;
            let e = JSON.parse(data);
            e.id = getNextEntityId();
            e.name = getNextEntityName();
            let pos = getComponent(e, "Position");
            if (pos) { pos.x += 1; pos.y += 1; }
            entities.push(e);
            selectedEntityIdx = entities.length - 1;
            updateEntityList();
            drawAll();
        }
        function deleteBlueprint(name) {
            localStorage.removeItem(BLUEPRINT_PREFIX + name);
            updateBlueprintList();
        }
        function updateBlueprintList() {
            blueprintListDiv.innerHTML = "";
            let blueprints = [];
            for (let k in localStorage) {
                if (k.startsWith(BLUEPRINT_PREFIX)) {
                    blueprints.push(k.substring(BLUEPRINT_PREFIX.length));
                }
            }
            blueprints.sort();
            blueprints.forEach(name => {
                let div = document.createElement('div');
                div.className = "entity-item";
                div.innerHTML = `<span>${name}</span>
                    <button class="load-btn" title="Load">Load</button>
                    <button class="delete-btn" title="Delete">✕</button>`;
                div.querySelector('.load-btn').onclick = (e) => { loadBlueprint(name); e.stopPropagation(); };
                div.querySelector('.delete-btn').onclick = (e) => { deleteBlueprint(name); e.stopPropagation(); };
                blueprintListDiv.appendChild(div);
            });
        }
        saveBlueprintBtn.addEventListener('click', function() {
            let name = blueprintNameInput.value.trim();
            if (!name) return;
            saveBlueprint(name);
        });

        // --- Init ---
        updateEntityList();
        drawAll();
        updateComponentPanel();
        updateSceneList();
        updateBlueprintList();
    </script>
</body>
</html>
