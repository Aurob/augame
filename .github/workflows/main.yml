name: Build Release and Upload

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'           # 0.1.0, v1.2.3
      - '[0-9]*.[0-9]*.[0-9]*-*'         # 0.1.0-beta, v1.2.3-rc.1
      - '0.x.x'                          # 0.x.x (unstable dev marker)
  workflow_dispatch:

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest

    steps:
    - uses: actions/checkout@v3

    - name: Verify Emscripten installation
      run: |
        emcc --version
        em++ --version

    - name: Compile with Emscripten
      run: |
        chmod +x compile.sh
        ./compile.sh

    - name: Set release filename
      id: vars
      run: echo "RELNAME=augame-${{ github.ref_name }}.com" >> $GITHUB_ENV

    - name: Download redbean with fallbacks
      shell: bash
      run: |
        set -e
        urls=(
          "https://cdn.dump.garden/redbean-3.0.0.com"
          "https://s3.us-east-1.wasabisys.com/rau-cdn/redbean-3.0.0.com"
          "https://redbean.dev/redbean-latest.com"
        )
        for u in "${urls[@]}"; do
          echo "Trying $u..."
          if curl -fL "$u" -o "$RELNAME"; then
            echo "Downloaded from $u"
            exit 0
          fi
        done
        echo "All download attempts failed."
        exit 1

    - name: Package zip
      run: |
        # Create empty root directory in zip
        mkdir empty_dir
        zip -r "$RELNAME" empty_dir
        rm -rf empty_dir

        # Add files with proper paths
        zip -r "$RELNAME" .init.lua
        zip -r "$RELNAME" web/index.html
        zip -r "$RELNAME" web/editor
        zip -r "$RELNAME" web/econfigs/default.njn
        zip -r "$RELNAME" web/scripts
        zip -0 "$RELNAME" web/build/main.wasm web/build/main.js
        zip -r "$RELNAME" web/resources/page

        # Add custom redbean icon
        cp web/resources/page/Diogenex10.gif redbean.png
        zip -0 "$RELNAME" redbean.png
        rm redbean.png
  

    - name: Extract tag message
      id: tag_message
      run: |
        # Get the full tag annotation message
        TAG_MESSAGE=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
        # Use multiline output format for GitHub Actions
        echo "message<<EOF" >> $GITHUB_OUTPUT
        echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: ${{ steps.tag_message.outputs.message }}
        files: ${{ env.RELNAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}

