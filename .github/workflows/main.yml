name: Build Release and Upload

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'           # v0.1.0, v1.2.3
      - 'v[0-9]*.[0-9]*.[0-9]*-*'         # v0.1.0-beta, v1.2.3-rc.1
      - 'v0.x.x'                          # v0.x.x (unstable dev marker)
  workflow_dispatch:

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest

    steps:
    - uses: actions/checkout@v3

    - name: Verify Emscripten installation
      run: |
        emcc --version
        em++ --version

    - name: Compile with Emscripten
      run: |
        chmod +x compile.sh
        ./compile.sh

    - name: Set release filename
      id: vars
      run: echo "RELNAME=augame-${{ github.run_number }}.com" >> $GITHUB_ENV

    - name: Download redbean with fallbacks
      shell: bash
      run: |
        set -e
        urls=(
          "https://cdn.dump.garden/redbean-3.0.0.com"
          "https://s3.us-east-1.wasabisys.com/rau-cdn/redbean-3.0.0.com"
          "https://redbean.dev/redbean-latest.com"
        )
        for u in "${urls[@]}"; do
          echo "Trying $u..."
          if curl -fL "$u" -o "$RELNAME"; then
            echo "Downloaded from $u"
            exit 0
          fi
        done
        echo "All download attempts failed."
        exit 1

    - name: Package zip
      run: |
        zip -r "$RELNAME" \
               .init.lua \
               404.html \
               index.html \
               web/index.html \
               web/editor  \
               web/econfigs/default.njn \
               web/scripts/ \
               web/resources/page/ \
               README.md \
               LICENSE
        zip -0 "$RELNAME" web/build/main.wasm web/build/main.js
        cp web/resources/page/Diogenex10.gif redbean.png
        zip -0 "$RELNAME" redbean.png

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: ${{ env.RELNAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}

