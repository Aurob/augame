name: Build Release and Upload

on:
  push:
    branches:
      - main
      - itch
  workflow_dispatch:

jobs:
  # ===== MAIN BRANCH RELEASE =====
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'
        actions-cache-folder: 'emsdk-cache-${{ runner.os }}'

    - name: Verify Emscripten installation
      run: |
        emcc --version
        em++ --version

    - name: Compile with Emscripten
      run: |
        chmod +x compile.sh
        ./compile.sh

    - name: Download redbean with fallbacks
      run: |
        set -e
        urls=(
          "https://cdn.dump.garden/redbean-3.0.0.com"
          "https://s3.us-east-1.wasabisys.com/rau-cdn/redbean-3.0.0.com"
          "https://redbean.dev/redbean-latest.com"
        )
        for u in "${urls[@]}"; do
          echo "Trying $u..."
          if curl -fL "$u" -o augame.com; then
            echo "Downloaded from $u"
            exit 0
          fi
        done
        echo "All download attempts failed."
        exit 1

    - name: Package zip
      run: |
        zip -r augame.com \
               .init.lua \
               404.html \
               index.html \
               web/index.html \
               web/editor  \
               web/econfigs/default.njn \
               web/scripts/ \
               web/resources/page/ \
               README.md \
               LICENSE
        zip -0 augame.com web/build/main.wasm web/build/main.js
        cp web/resources/page/Diogenex10.gif redbean.png
        zip -0 augame.com redbean.png

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release ${{ github.run_number }}
        files: augame.com
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}

  # ===== ITCH.IO DEPLOY =====
  build-and-upload-itch:
    if: github.ref == 'refs/heads/itch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Zip Repository
      run: |
        zip -r augame.zip .

    - name: Upload to itch.io
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
        unzip butler.zip
        chmod +x butler
        ./butler push augame.zip aurob/augame:main
